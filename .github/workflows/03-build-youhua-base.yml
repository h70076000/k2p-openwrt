name: "构建友华WR1200JS基础固件"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt版本'
        required: true
        default: '23.05'
        type: choice
        options:
        - '23.05'
        - '22.03'
        - '19.05'

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  CONFIG_FILE: configs/youhua/base.config
  TARGET: ramips
  SUBTARGET: mt7621
  PROFILE: youhua_wr1200js
  DEVICE_NAME: "友华WR1200JS"

jobs:
  build-youhua-base:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 设置构建环境
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses5-dev \
          libssl-dev \
          python3 \
          python3-distutils \
          python3-pip \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          quilt \
          libelf-dev

    - name: 克隆OpenWrt源码
      run: |
        BRANCH="openwrt-${{ github.event.inputs.version }}"
        echo "正在克隆OpenWrt $BRANCH 分支，为 $DEVICE_NAME 构建..."
        git clone --depth=1 $REPO_URL -b $BRANCH openwrt-youhua

    - name: 配置Feeds（软件源）
      run: |
        cd openwrt-youhua
        BRANCH="openwrt-${{ github.event.inputs.version }}"
        echo "src-git packages https://git.openwrt.org/feed/packages.git;$BRANCH" > feeds.conf
        echo "src-git luci https://git.openwrt.org/project/luci.git;$BRANCH" >> feeds.conf
        echo "src-git hxzn https://github.com/h70076000/hxzn-package.git;" >> feeds.conf
        echo "src-git routing https://git.openwrt.org/feed/routing.git;$BRANCH" >> feeds.conf
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 应用基础配置
      run: |
        cd openwrt-youhua
        cp ../$CONFIG_FILE .config
        make defconfig
        echo "=== $DEVICE_NAME 配置预览 ==="
        echo "目标设备:"
        grep "CONFIG_TARGET.*DEVICE.*youhua" .config || echo "未找到设备配置"
        echo ""
        echo "关键包配置:"
        grep "^CONFIG_PACKAGE_" .config | head -20

    - name: 下载软件包
      run: |
        cd openwrt-youhua
        echo "开始下载所需的软件包..."
        make -j$(nproc) download
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译OpenWrt固件
      run: |
        cd openwrt-youhua
        echo "开始为 $DEVICE_NAME 编译固件，请耐心等待 (约60-90分钟)..."
        make -j$(($(nproc) + 1)) V=s 2>&1 | tee build.log
        
        # 检查编译结果
        echo "=== 编译结果检查 ==="
        if tail -10 build.log | grep -q "make.*Error"; then
          echo "❌ 编译过程中出现错误"
          echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
          exit 1
        else
          echo "✅ 编译命令执行完成"
        fi

    - name: 查找并上传固件
      run: |
        cd openwrt-youhua
        echo "=== 查找生成的固件 ==="
        
        # 查找固件文件
        FIRMWARE_FILES=$(find bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*youhua*" -o -name "*wr1200*" \) 2>/dev/null || true)
        
        if [ -n "$FIRMWARE_FILES" ]; then
          echo "🎉 找到固件文件:"
          echo "$FIRMWARE_FILES"
          
          # 复制固件到根目录方便上传
          mkdir -p ../firmware-youhua
          for f in $FIRMWARE_FILES; do
            cp "$f" ../firmware-youhua/
          done
          
          ls -lh ../firmware-youhua/
          echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
        else
          echo "⚠️ 未找到固件文件，检查目录结构:"
          find bin/targets -type f 2>/dev/null | head -20
          echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
        fi

    - name: 上传固件到Artifacts
      if: env.BUILD_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: youhua-wr1200js-base-firmware
        path: firmware-youhua/*
        retention-days: 7

    - name: 上传编译日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-youhua-base
        path: openwrt-youhua/build.log
        retention-days: 7

    - name: 上传配置文件
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: youhua-configs
        path: configs/youhua/*
        retention-days: 7
